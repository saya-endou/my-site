  "images/q2.png",
  "images/q3.png",
  "images/q4.png",
  "images/q5.png"

];



/* =====================================================
   Q6〜Q10の画像
   Q6 → q6.png
   Q7 → q7.png
   Q8 → q8.png
   Q9 → q9.png
   Q10 → q10.png
===================================================== */

const additionalImages = [

  "images/q6.png",
  "images/q7.png",
  "images/q8.png",
  "images/q9.png",
  "images/q10.png"

];



/* =====================================================
   診断スタート
===================================================== */

function startDiagnosis() {

  document
    .getElementById("start-screen")
    .classList.add("hidden");


  document
    .getElementById("common-screen")
    .classList.remove("hidden");


  commonIndex = 0;


  showCommonQuestion();

}



/* =====================================================
   Q1〜Q5表示
===================================================== */

function showCommonQuestion() {

  const question =
    commonQuestions[commonIndex];


  /* 質問文 */

  document
    .getElementById("common-question")
    .textContent =
    question.question;



  /* =================================================
     進捗
  ================================================= */

  const number =
    commonIndex + 1;


  document
    .getElementById("progress-number")
    .textContent =
    number;


  document
    .getElementById("progress-fill")
    .style.width =
    `${number / 10 * 100}%`;



  /* =================================================
     Q1〜Q5の画像
     
     commonIndex
     0 → q1.png
     1 → q2.png
     2 → q3.png
     3 → q4.png
     4 → q5.png
  ================================================= */

  const image =
    document.getElementById(
      "common-person-image"
    );


  image.src =
    commonImages[commonIndex];



  /* 回答欄 */

  const answers =
    document.getElementById(
      "common-answers"
    );


  answers.innerHTML = "";


  question.answers.forEach(
    function(answer) {

      const button =
        document.createElement("button");


      button.className =
        "answer-button";


      button.textContent =
        answer.text;


      button.type =
        "button";


      button.onclick =
        function() {

          selectCommonAnswer(
            answer.type
          );

        };


      answers.appendChild(button);

    }
  );

}



/* =====================================================
   Q1〜Q5回答
===================================================== */

function selectCommonAnswer(type) {

  typeScores[type]++;


  /* Q5の回答を保存 */

  if (commonIndex === 4) {

    q5SelectedType = type;

  }


  commonIndex++;


  if (
    commonIndex <
    commonQuestions.length
  ) {

    showCommonQuestion();

  }

  else {

    decideType();

  }

}



/* =====================================================
   A〜D決定
===================================================== */

function decideType() {

  const max =
    Math.max(
      typeScores.A,
      typeScores.B,
      typeScores.C,
      typeScores.D
    );


  const topTypes =
    Object.keys(typeScores)
      .filter(
        function(type) {

          return typeScores[type] === max;

        }
      );


  /*
    同点の場合はQ5の回答を優先
  */

  if (
    topTypes.includes(q5SelectedType)
  ) {

    selectedType =
      q5SelectedType;

  }

  else {

    selectedType =
      topTypes[0];

  }


  startAdditionalQuestions();

}



/* =====================================================
   Q6〜Q10開始
===================================================== */

function startAdditionalQuestions() {

  document
    .getElementById("common-screen")
    .classList.add("hidden");


  document
    .getElementById("type-screen")
    .classList.remove("hidden");


  additionalIndex = 0;


  personScores = {};


  lastSelectedPerson = null;


  /*
    選ばれたタイプの4人を
    0点からスタート
  */

  types[selectedType].people.forEach(

    function(person) {

      personScores[person.name] = 0;

    }

  );


  showAdditionalQuestion();

}



/* =====================================================
   Q6〜Q10表示
===================================================== */

function showAdditionalQuestion() {

  const question =
    additionalQuestions[selectedType]
    [additionalIndex];


  /* 質問文 */

  document
    .getElementById("type-question")
    .textContent =
    question.question;



  /* =================================================
     進捗
  ================================================= */

  const number =
    additionalIndex + 6;


  document
    .getElementById("progress-number-type")
    .textContent =
    number;


  document
    .getElementById("progress-fill-type")
    .style.width =
    `${number / 10 * 100}%`;



  /* =================================================
     Q6〜Q10の画像
     
     additionalIndex
     0 → q6.png
     1 → q7.png
     2 → q8.png
     3 → q9.png
     4 → q10.png
  ================================================= */

  const image =
    document.getElementById(
      "type-person-image"
    );


  image.src =
    additionalImages[additionalIndex];



  /* =================================================
     回答
  ================================================= */

  const answers =
    document.getElementById(
      "type-answers"
    );


  answers.innerHTML = "";


  question.answers.forEach(

    function(answer, index) {

      const button =
        document.createElement("button");


      button.className =
        "answer-button";


      button.type =
        "button";


      button.textContent =
        answer;


      /*
        Q6〜Q10の4つの回答は
        選ばれたタイプの4人の偉人に対応
      */

      const person =
        types[selectedType]
        .people[index];


      button.onclick =
        function() {

          selectAdditionalAnswer(
            person.name
          );

        };


      answers.appendChild(button);

    }

  );

}



/* =====================================================
   Q6〜Q10回答
===================================================== */

function selectAdditionalAnswer(
  personName
) {

  /* 得点を追加 */

  personScores[personName]++;


  /* 最後に選択した偉人を保存 */

  lastSelectedPerson =
    personName;


  additionalIndex++;


  /* Q6〜Q10がまだ残っている */

  if (
    additionalIndex < 5
  ) {

    showAdditionalQuestion();

  }

  /* Q10終了 */

  else {

    decidePerson();

  }

}



/* =====================================================
   16タイプ・偉人決定
===================================================== */

function decidePerson() {

  const scores =
    Object.entries(
      personScores
    );


  const max =
    Math.max(

      ...scores.map(

        function(item) {

          return item[1];

        }

      )

    );


  const winners =
    scores.filter(

      function(item) {

        return item[1] === max;

      }

    );



  /*
    同点の場合は
    Q10の最後の回答を優先
  */

  if (
    winners.length > 1
  ) {

    const q10Winner =
      lastSelectedPerson;


    if (
      q10Winner &&
      winners.some(
        function(winner) {

          return winner[0] === q10Winner;

        }
      )
    ) {

      showResult(q10Winner);

      return;

    }


    /*
      それでも決まらなければ
      偉人の順番で決定
    */

    showResult(
      winners[0][0]
    );

  }

  else {

    showResult(
      winners[0][0]
    );

  }

}



/* =====================================================
   診断結果
===================================================== */

function showResult(
  personName
) {

  document
    .getElementById("type-screen")
    .classList.add("hidden");


  document
    .getElementById("result-screen")
    .classList.remove("hidden");



  /* 選ばれた偉人を取得 */

  const person =
    types[selectedType]
    .people
    .find(

      function(person) {

        return person.name === personName;

      }

    );



  /* =================================================
     タイプ名
  ================================================= */

  document
    .getElementById("result-type")
    .textContent =
    types[selectedType].name;



  /* =================================================
     偉人名
  ================================================= */

  document
    .getElementById("result-person")
    .textContent =
    person.name;



  /* =================================================
     偉人画像
  ================================================= */

  const resultImage =
    document.getElementById(
      "result-image"
    );


  resultImage.src =
    person.image;



  /* =================================================
     結果説明
  ================================================= */

  document
    .getElementById(
      "result-description"
    )
    .innerHTML =

    `

      <h3>
        あなたの失敗タイプ
      </h3>

      <p>
        ${types[selectedType].description}
      </p>


      <h3>
        似ている偉人キャラ
      </h3>

      <p>
        ${person.description}
      </p>


      <p>
        あなたの失敗の仕方や、
        失敗したときの考え方は、
        この偉人タイプに近いかもしれません。
      </p>

    `;

}


</script>
